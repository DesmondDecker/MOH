server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers appropriate for a health-data-adjacent app.
    # Content-Security-Policy is deliberately NOT set here — this app talks
    # to a configurable API origin (VITE_API_BASE_URL) and, per the map
    # component, to OpenStreetMap tile servers, so a correct CSP has to be
    # assembled with knowledge of the actual deployed API/tile origins
    # rather than hardcoded here; get it wrong and the app silently breaks.
    # Set it at the deployment/reverse-proxy layer where those origins are
    # actually known.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed asset filenames (Vite's default) are safe to cache
    # aggressively and forever — a new build produces new filenames, so
    # there's no staleness risk.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real file (e.g. a direct link to
    # /clinical/patients/abc123 or a hard refresh on a client-side route)
    # serves index.html so React Router can take over, instead of nginx
    # returning its own 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
